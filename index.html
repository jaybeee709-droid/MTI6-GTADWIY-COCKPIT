<!doctype html>
<html lang="en-US" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MTI6-GTADWIY-COCKPIT</title>
  <meta name="description" content="Offline-first personal cockpit: notes, tasks, expenses, and projects — all stored locally on your device." />
  <meta name="theme-color" content="#05070a" />
  <meta name="color-scheme" content="dark light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GTADWIY Cockpit" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app-shell">
    <header id="top-bar">
      <button id="menu-toggle" aria-label="Open menu">☰</button>
      <span id="app-title">World Globe</span>
      <button id="star-btn" class="star-top-btn" type="button" aria-label="Open STAR 3.0 overlay">🌟 <span class="star-top-label">STAR</span></button>
      <select id="quick-nav" aria-label="Quick navigation">
        <option value="globe">World Globe</option>
        <option value="crypto-world">Crypto World</option>
        <option value="bot-ops">Bot Operations</option>
        <option value="wallets">Wallets</option>
        <option value="opportunities">Opportunities</option>
        <option value="earn">Earnings</option>
        <option value="positions">Positions &amp; Assets</option>
        <option value="encyclopedia">Encyclopedia</option>
        <option value="dashboard">Cockpit Status</option>
        <option value="operations">Operations</option>
      </select>
      <button id="install-btn" class="hidden">Install</button>
    </header>

    <div id="global-search-wrap">
      <input id="global-search-input" type="search" placeholder="Search the cockpit and the web…" aria-label="Global search" />
      <select id="global-search-source" aria-label="Search source">
        <option value="auto">Auto (bot picks)</option>
        <option value="app">This app</option>
        <option value="web">Web</option>
        <option value="crypto">Crypto</option>
        <option value="github">GitHub</option>
        <option value="news">News</option>
        <option value="knowledge">Saved knowledge</option>
        <option value="encyclopedia">Encyclopedia</option>
        <option value="page">Page (URL)</option>
      </select>
      <button id="global-search-btn" class="btn btn-primary" type="button">Search</button>
    </div>
    <div id="global-search-results" class="hidden" role="region" aria-label="Search results"></div>

    <div id="nav-scrim"></div>

    <nav id="side-nav" aria-label="Main navigation">
      <div id="nav-links"></div>
    </nav>

    <main id="main-content">
      <div id="offline-indicator" role="status" aria-live="polite"></div>
      <div id="view-root" role="main" aria-live="polite"></div>
    </main>
  </div>

  <noscript>This app needs JavaScript enabled to run — it still works fully offline once loaded, with no server involved.</noscript>

  <script src="./js/utils.js"></script>
  <!-- Overnight shift (Nov 13–14, 2026): shared truthful-state vocabulary
       (Truth) — no dependencies, loads first so other layers can use it. -->
  <script src="./js/truth.js"></script>
  <!-- Campaign (Nov 14, 2026): Asset + Network Intelligence foundations —
       depend on Truth only, load right after it. -->
  <script src="./js/asset-intelligence.js"></script>
  <script src="./js/network-intelligence.js"></script>
  <script src="./js/api-client.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/backup.js"></script>
  <!-- Star 3.0 layers, in dependency order: state, backend, router, UI -->
  <script src="./js/star-state.js"></script>
  <script src="./js/star-backend.js"></script>
  <script src="./js/star-router.js"></script>
  <!-- Overnight shift: StarCommand fail-closed command layer (P2/P3),
       after the router, before the Star UI that calls it. -->
  <script src="./js/star-command.js"></script>
  <!-- Campaign (Nov 14, 2026): Model Router, Wallet Intelligence, Tool Router —
       depend on Truth + StarCommand; load after StarCommand, before the Star UI. -->
  <script src="./js/model-router.js"></script>
  <script src="./js/wallet-intelligence.js"></script>
  <script src="./js/tool-router.js"></script>
  <script src="./js/modules/star.js"></script>
  <!-- Master shell (Build 1): tribes, navigation structure, floating
       windows, summonable participants, STAR overlay -->
  <script src="./js/tribes.js"></script>
  <!-- Overnight shift: BotOpsModel (P4/P5) — bot identity + worker-task
       orchestration model; reads Tribes, no worker runtime exists. -->
  <script src="./js/bot-ops-model.js"></script>
  <!-- Campaign (Nov 14, 2026): Angel Security — depends on Truth + BotOpsModel;
       loads right after the BotOps model. -->
  <script src="./js/angel-security.js"></script>
  <script src="./js/nav.js"></script>
  <script src="./js/window-manager.js"></script>
  <script src="./js/participants.js"></script>
  <script src="./js/star-overlay.js"></script>
  <!-- API registry (must load before price-scout) and health panel -->
  <script src="./js/api-registry.js"></script>
  <!-- Price Scouts: data layer first, then the dashboard panel -->
  <script src="./js/price-scout.js"></script>
  <script src="./js/knowledge.js"></script>
  <!-- Overnight shift: KnowledgeModel (P1) — knowledge object model on
       the existing mti6_knowledge_v1 store. -->
  <script src="./js/knowledge-model.js"></script>
  <script src="./js/github-dev.js"></script>
  <script src="./js/crypto-world.js"></script>
  <script src="./js/data/encyclopedia-batch-a.js"></script>
  <script src="./js/data/encyclopedia-canonical-60.js"></script>
  <script src="./js/data/encyclopedia-batch-b.js"></script>
  <script src="./js/encyclopedia-import.js"></script>
  <script src="./js/modules/prices.js"></script>
  <script src="./js/modules/api-health.js"></script>
  <script src="./js/modules/scouts.js"></script>
  <script src="./js/modules/devcenter.js"></script>
  <script src="./js/modules/crypto-world.js"></script>
  <script src="./js/modules/encyclopedia.js"></script>
  <!-- Overnight shift: EncyclopediaBridge (P6) — STAR ↔ Encyclopedia
       structural retrieval; loads after the data files + import layer,
       before global-search.js which calls it. -->
  <script src="./js/encyclopedia-bridge.js"></script>
  <script src="./js/screens-nav.js"></script>
  <script src="./js/modules/globe.js"></script>
  <script src="./js/modules/crypto.js"></script>
  <script src="./js/modules/accounts.js"></script>
  <script src="./js/modules/earn.js"></script>
  <script src="./js/modules/web.js"></script>
  <script src="./js/modules/security.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/modules/analytics.js"></script>
  <script src="./js/global-search.js"></script>
  <script src="./js/modules/dashboard.js"></script>
  <script src="./js/modules/vault.js"></script>
  <script src="./js/modules/tasks.js"></script>
  <script src="./js/modules/expenses.js"></script>
  <script src="./js/modules/projects.js"></script>
  <script src="./js/modules/settings.js"></script>
  <!-- Master shell (Build 1) screens -->
  <script src="./js/modules/bot-ops.js"></script>
  <script src="./js/modules/wallets.js"></script>
  <script src="./js/modules/opportunities.js"></script>
  <script src="./js/modules/positions.js"></script>
  <script src="./js/modules/operations.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
